name: Branded desktop package
run-name: ${{ inputs.brand_name }} / ${{ inputs.platform }} / ${{ inputs.package_format }} / ${{ inputs.connection_role }}

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [macos, windows, linux]
        required: true
      package_format:
        type: choice
        options: [dmg, exe, msi, deb]
        required: true
      brand_name:
        type: string
        default: ectron
        required: true
      connection_role:
        description: 'standard: normal client; host: controlled Linux/Windows computer; controller: your Mac/Windows'
        type: choice
        options: [standard, host, controller]
        default: standard
        required: true
      host_id:
        description: 'Optional existing host device ID to prefill in a controller build'
        type: string
        default: ''
      hwcodec:
        type: boolean
        default: false
      unix_file_copy_paste:
        type: boolean
        default: false

permissions:
  contents: read

env:
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_DISABLE_METRICS: '1'
  BRAND_NAME: ${{ inputs.brand_name }}
  BUILD_PLATFORM: ${{ inputs.platform }}
  PACKAGE_FORMAT: ${{ inputs.package_format }}
  HWCODEC: ${{ inputs.hwcodec }}
  UNIX_COPY: ${{ inputs.unix_file_copy_paste }}
  CONNECTION_ROLE: ${{ inputs.connection_role }}
  HOST_ID: ${{ inputs.host_id }}
  BUILD_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}

jobs:
  bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate personal build settings
        env:
          ECTRON_HOST_PASSWORD: ${{ secrets.ECTRON_HOST_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from res.connection_role import validate_role
          role = os.environ['CONNECTION_ROLE']
          validate_role(role, os.environ['BUILD_PLATFORM'], os.environ['PACKAGE_FORMAT'], os.environ['HOST_ID'])
          if role != 'standard':
              if os.environ['BUILD_REPOSITORY_PRIVATE'] != 'true':
                  raise SystemExit('Use a private repository for installers containing your shared password.')
              password = os.environ.get('ECTRON_HOST_PASSWORD', '')
              if not 12 <= len(password) <= 128 or '\n' in password or '\r' in password:
                  raise SystemExit('Set the ECTRON_HOST_PASSWORD repository secret to a password of 12–128 characters.')
          PY
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-3-dev ninja-build
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.81'
          components: rustfmt
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.22.3'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: desktop-bridge
      - name: Generate Flutter Rust bridge
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-bridge
          if-no-files-found: error
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h

  package:
    needs: bridge
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || inputs.platform == 'macos' && 'macos-14' || 'ubuntu-22.04' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux native tools
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev llvm-dev nasm ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libasound2-dev libpulse-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev \
            libva-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev
      - name: Install macOS native tools
        if: inputs.platform == 'macos'
        run: |
          brew install cmake ninja pkgconf llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          curl -fL https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip -o "$RUNNER_TEMP/nasm.zip"
          unzip "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nasm-2.16.03" >> "$GITHUB_PATH"
      - name: Configure Windows libclang
        if: inputs.platform == 'windows'
        run: echo 'LIBCLANG_PATH=C:/Program Files/LLVM/bin' >> "$GITHUB_ENV"
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        if: inputs.package_format == 'msi'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.24.5'
      - name: Apply checkout's Flutter patches
        run: |
          sdk="$(dirname "$(dirname "$(command -v flutter)")")"
          git -C "$sdk" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if [ "$BUILD_PLATFORM" = macos ]; then
            python -c 'import pathlib, sys; p = pathlib.Path(sys.argv[1]); p.write_text(p.read_text().replace("_setFramesEnabledState(false);", "//_setFramesEnabledState(false);"))' "$sdk/packages/flutter/lib/src/scheduler/binding.dart"
          fi
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.81'
          components: rustfmt
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - name: Install pinned native libraries
        run: |
          case "$BUILD_PLATFORM" in
            windows) triplet=x64-windows-static ;;
            macos) triplet=arm64-osx ;;
            linux) triplet=x64-linux ;;
          esac
          export VCPKG_DEFAULT_HOST_TRIPLET="$triplet"
          if [ "$HWCODEC" = true ]; then
            "$VCPKG_ROOT/vcpkg" install --triplet "$triplet" --x-install-root="$VCPKG_ROOT/installed"
          else
            "$VCPKG_ROOT/vcpkg" install libyuv libvpx aom opus --classic --triplet "$triplet" \
              --overlay-ports="$GITHUB_WORKSPACE/res/vcpkg" --overlay-triplets="$GITHUB_WORKSPACE/res/vcpkg-triplets"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-bridge
          path: .
      - name: Prepare branded sources
        id: brand
        run: |
          python -c 'import os; from pathlib import Path; from res.branding import prepare_brand; p = prepare_brand(Path.cwd(), os.environ["BRAND_NAME"]); open(os.environ["GITHUB_OUTPUT"], "a").write("workspace=" + p.relative_to(Path.cwd()).as_posix() + "\n")'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ steps.brand.outputs.workspace }}
          prefix-key: desktop-${{ inputs.platform }}-${{ inputs.brand_name }}
      - name: Build requested package
        env:
          ECTRON_HOST_PASSWORD: ${{ secrets.ECTRON_HOST_PASSWORD }}
          ECTRON_PAIRING_URL: ${{ vars.ECTRON_PAIRING_URL }}
          ECTRON_PAIRING_HOST_TOKEN: ${{ secrets.ECTRON_PAIRING_HOST_TOKEN }}
          ECTRON_PAIRING_CONTROLLER_TOKEN: ${{ secrets.ECTRON_PAIRING_CONTROLLER_TOKEN }}
        run: |
          args=(--platform "$BUILD_PLATFORM" --package-format "$PACKAGE_FORMAT" --brand-name "$BRAND_NAME" --connection-role "$CONNECTION_ROLE" --host-id "$HOST_ID")
          if [ "$HWCODEC" = true ]; then args+=(--hwcodec); fi
          if [ "$UNIX_COPY" = true ]; then args+=(--unix-file-copy-paste); fi
          python -m res.ci_build "${args[@]}"
      - name: Verify Windows host installation
        if: inputs.platform == 'windows' && inputs.package_format == 'msi' && inputs.connection_role == 'host'
        shell: pwsh
        env:
          ECTRON_HOST_PASSWORD: ${{ secrets.ECTRON_HOST_PASSWORD }}
          ECTRON_PAIRING_URL: ${{ vars.ECTRON_PAIRING_URL }}
          ECTRON_PAIRING_HOST_TOKEN: ${{ secrets.ECTRON_PAIRING_HOST_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-ChildItem build/dist/*-host.msi | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'host-msi-install.log'
          $process = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $package.FullName + '"'), '/norestart', '/l*v', ('"' + $log + '"')) -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Automatic host MSI installation did not finish' }
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Host setup failed with exit code $($process.ExitCode)"
          }
          if (-not (Select-String -Path $log -Pattern 'Property\(S\): UILevel = 3$' -Quiet)) { throw 'The MSI must use basic UI without wizard dialogs' }
          foreach ($folder in @([Environment]::GetFolderPath('DesktopDirectory'), [Environment]::GetFolderPath('CommonDesktopDirectory'))) {
            if (Test-Path (Join-Path $folder "$env:BRAND_NAME.lnk")) { throw 'The host must have no desktop shortcut' }
          }
          $service = Get-CimInstance Win32_Service -Filter "Name='$env:BRAND_NAME'"
          if ($service.State -ne 'Running' -or $service.StartMode -ne 'Auto') { throw 'The host service must be running with automatic startup' }
          $profilePath = Join-Path $env:ProgramData ($env:BRAND_NAME.ToLower() + '/host/host-connection.json')
          $profile = Get-Content $profilePath -Raw | ConvertFrom-Json
          if ($profile.id -notmatch '^\d{6,16}$' -or $profile.password -cne $env:ECTRON_HOST_PASSWORD) { throw 'Host connection profile validation failed' }
          $executable = Join-Path $env:ProgramFiles ($env:BRAND_NAME + '/' + $env:BRAND_NAME + '.exe')
          $retry = Start-Process $executable -ArgumentList '--setup-host' -Wait -PassThru
          if ($retry.ExitCode -ne 0) { throw 'Reapplying unattended host settings failed' }
          Stop-Service -Name $env:BRAND_NAME
          if ($env:ECTRON_PAIRING_URL) {
            $headers = @{ Authorization = ('Bearer ' + $env:ECTRON_PAIRING_HOST_TOKEN) }
            Invoke-RestMethod -Method Delete -Uri ($env:ECTRON_PAIRING_URL + '/v1/hosts/' + $profile.device_key) -Headers $headers | Out-Null
          }
          Write-Host 'Verified host installation, automatic service startup, shared password and unattended settings.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ inputs.platform }}-${{ inputs.package_format }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14
